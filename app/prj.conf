# Logging
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y

# CAN + ISO-TP
CONFIG_CAN=y
CONFIG_ISOTP=y
CONFIG_ISOTP_RX_BUF_COUNT=4
CONFIG_ISOTP_RX_SF_FF_BUF_COUNT=2

# Modbus server fed through the raw ADU interface (see modbus_rtu.h)
CONFIG_MODBUS=y
CONFIG_MODBUS_ROLE_SERVER=y
CONFIG_MODBUS_RAW_ADU=y
CONFIG_MODBUS_NUMOF_RAW_ADU=1

# UART interrupt API for the RTU framer
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_THREAD_NAME=y
